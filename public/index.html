<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مؤسسة Again من جديد</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3f6f4;--sf:#fff;--tx:#17231e;--mu:#5d6b64;--bd:#d9e1dc;--pr:#14463a;--pt:#fff;--ac:#c9821a;--ok:#1d7a4f;--er:#b3402f;--hl:#e9f1ed;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1714;--sf:#18221e;--tx:#e8efeb;--mu:#9baba3;--bd:#2c3b35;--pr:#3fa586;--pt:#06130e;--ac:#e3a444;--ok:#4cc08a;--er:#e8806f;--hl:#1f2e28;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1714;--sf:#18221e;--tx:#e8efeb;--mu:#9baba3;--bd:#2c3b35;--pr:#3fa586;--pt:#06130e;--ac:#e3a444;--ok:#4cc08a;--er:#e8806f;--hl:#1f2e28;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 Cairo,"Segoe UI",Tahoma,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pr);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--pr);color:var(--pt);display:flex;align-items:center;gap:12px;padding:10px 16px}
header b{font-weight:800;font-size:17px}header span{opacity:.85;font-size:13px;margin-inline-start:auto}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:7px 14px;background:var(--pr);color:var(--pt);font-weight:600}
button.g{background:transparent;color:inherit;border:1px solid currentColor}
button.ok{background:var(--ok);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd)}
nav button{background:transparent;color:var(--mu);white-space:nowrap}
nav button.on{background:var(--hl);color:var(--pr);box-shadow:inset 0 -3px var(--ac)}
main{max-width:960px;margin:0 auto;padding:16px}
h2{margin:6px 0 14px;font-size:20px}h3{margin:20px 0 8px;font-size:16px}
.hero{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--sf)}
.hero div{padding:16px 18px}.hero div+div{border-inline-start:1px solid var(--bd);background:var(--hl)}
.hero small{display:block;color:var(--mu)}.hero b{font-size:24px;font-weight:800}.hero div:first-child b{color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.stats div{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 14px}.stats b{display:block;font-size:20px}.stats small{color:var(--mu)}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;background:var(--sf);border:1px solid var(--bd);font-size:14px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th{background:var(--hl);color:var(--mu);font-weight:600}
select,input{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;max-width:100%}input[type=number]{width:110px}
.tag{padding:2px 9px;border-radius:99px;background:var(--hl);font-size:12px}.tag.w{background:var(--ac);color:#201300}.tag.k{background:var(--ok);color:#fff}
.note{color:var(--mu);font-size:13px;margin:8px 0}.empty{padding:18px;text-align:center;color:var(--mu)}
.login{max-width:560px;margin:8vh auto;padding:0 16px}.login h1{font-size:30px;margin:0}.login p{color:var(--mu)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:16px}.roles button{background:var(--sf);color:var(--tx);border:1px solid var(--bd);padding:12px}
.roles button:hover{border-color:var(--pr)}img.ph{width:56px;height:56px;object-fit:cover;border-radius:6px}
